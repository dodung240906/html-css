<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded CSS Practice</title>
    <!-- Phần 2: Internal Style -->
    <style>
        h1 {
            color: green;
        }
    </style>
    <!-- Phần 3: External Style (Minh họa link CSS ngoài) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Phần 1: Inline Style & Nội dung đề bài -->
    <h1>This is heading 1</h1>
    <p style="color: blue;">This is an ordinary paragraph. Notice that this text is blue. The default text color for a page is defined in the body selector.</p>
</body>
</html>
